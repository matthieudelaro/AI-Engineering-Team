<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentWars — Spectator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/spectator/spectator.css" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <p class="hud__title">AgentWars</p>
        <p class="hud__game-id" id="game-id-label" aria-live="polite">—</p>
        <p class="hud__tick" id="tick-label" aria-live="polite">tick —</p>
        <p class="hud__legend" aria-hidden="true">
          <span class="legend__item">
            <span class="legend__swatch legend__swatch--nuked"></span>nuked
          </span>
          <span class="legend__item">
            <span class="legend__swatch legend__swatch--flag"></span>flag
          </span>
          <span class="legend__item">
            <span class="legend__pot">12</span>
            <span>pot</span>
          </span>
        </p>
      </header>

      <main class="stage">
        <canvas id="map-canvas" aria-label="Full game map"></canvas>
        <div class="stage__vignette" aria-hidden="true"></div>
      </main>

      <footer class="leaderboard" id="leaderboard" aria-label="Leaderboard"></footer>

      <div class="status" id="status" role="status" aria-live="polite"></div>
    </div>
    <script src="/spectator/spectator.js" type="module"></script>
  </body>
</html>
